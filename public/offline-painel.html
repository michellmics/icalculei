<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1c2b24">
  <title>Sem internet · Painel iCalculei</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: #1c2b24; color: #c8f7a3; font-family: "Source Sans 3", "Segoe UI", Roboto, sans-serif; text-align: center; }
    main { max-width: 420px; display: grid; gap: 14px; justify-items: center; }
    img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { margin: 0; font-size: 26px; }
    p { margin: 0; color: #8fb39e; line-height: 1.5; }
    .retry { text-decoration: none; border: 0; background: #c8f7a3; color: #1c2b24; font: inherit; font-weight: 700; padding: 10px 18px; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/painel-192.png" alt="">
    <h1>Painel sem internet</h1>
    <p>O painel mostra dados ao vivo e precisa de conexão. Por segurança, nada dele fica guardado neste aparelho.</p>
    <a class="retry" href="">tentar de novo</a>
  </main>
</body>
</html>
